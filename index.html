<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblical Detective: Documentary Hypothesis Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            color: #fff;
            image-rendering: pixelated;
        }

        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            color: #feca57;
            text-shadow: 3px 3px 0 #c44;
        }

        .subtitle {
            font-size: 0.6em;
            margin-bottom: 15px;
            color: #a0a0a0;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #feca57;
            box-shadow: 0 0 0 4px #222, 0 0 20px rgba(254, 202, 87, 0.3);
            background: #0f0f23;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 640px;
            padding: 10px 5px;
            font-size: 0.7em;
        }

        #sourceDisplay {
            display: flex;
            gap: 8px;
        }

        .source-box {
            width: 40px;
            height: 40px;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            opacity: 0.3;
            transition: all 0.2s;
        }

        .source-box.collected {
            opacity: 1;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .source-j { border-color: #f1c40f; color: #f1c40f; }
        .source-e { border-color: #2ecc71; color: #2ecc71; }
        .source-d { border-color: #3498db; color: #3498db; }
        .source-p { border-color: #9b59b6; color: #9b59b6; }

        .source-box.collected.source-j { background: rgba(241, 196, 15, 0.3); box-shadow: 0 0 10px #f1c40f; }
        .source-box.collected.source-e { background: rgba(46, 204, 113, 0.3); box-shadow: 0 0 10px #2ecc71; }
        .source-box.collected.source-d { background: rgba(52, 152, 219, 0.3); box-shadow: 0 0 10px #3498db; }
        .source-box.collected.source-p { background: rgba(155, 89, 182, 0.3); box-shadow: 0 0 10px #9b59b6; }

        #lives {
            color: #e74c3c;
        }

        #controls {
            font-size: 0.5em;
            color: #666;
            margin-top: 10px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #overlay.hidden {
            display: none;
        }

        #overlay h2 {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #feca57;
        }

        #overlay p {
            font-size: 0.6em;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.8;
            max-width: 80%;
        }

        #overlay button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7em;
            padding: 15px 30px;
            background: #feca57;
            color: #1a1a2e;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        #overlay button:hover {
            background: #fff;
        }

        .win { color: #2ecc71 !important; }
        .lose { color: #e74c3c !important; }
    </style>
</head>
<body>
    <h1>BIBLICAL DETECTIVE</h1>
    <p class="subtitle">THE DOCUMENTARY HYPOTHESIS QUEST</p>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div id="overlay">
            <h2 id="overlayTitle">BIBLICAL DETECTIVE</h2>
            <p id="overlayText">
                Collect the four sources of the<br>
                Documentary Hypothesis!<br><br>
                J - Jahwist | E - Elohist<br>
                D - Deuteronomist | P - Priestly<br><br>
                Avoid the ancient scrollworms!
            </p>
            <button id="startBtn">START GAME</button>
        </div>
    </div>

    <div id="hud">
        <div id="sourceDisplay">
            <div class="source-box source-j" id="box-j">J</div>
            <div class="source-box source-e" id="box-e">E</div>
            <div class="source-box source-d" id="box-d">D</div>
            <div class="source-box source-p" id="box-p">P</div>
        </div>
        <div id="lives">♥♥♥</div>
    </div>

    <p id="controls">ARROW KEYS or WASD to move</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const W = canvas.width;
        const H = canvas.height;
        const TILE = 32;

        // Sprite data - Biblical Detective (your pixel art character!)
        // 5 frames: idle, walk1, walk2, walk3, walk4
        const SPRITE_DATA = {
            // Each sprite is 16x24 pixels, scaled up 2x to 32x48
            width: 16,
            height: 24,
            scale: 2,
            frames: {
                // Frame data as pixel arrays - detective with hat and coat
                idle: [
                    "................",
                    "................",
                    "....444444......",
                    "...4444444......",
                    "...4444444......",
                    "....FFFF........",
                    "....FEEF........",
                    "....FFFF........",
                    ".....FF.........",
                    "...222222.......",
                    "...223222.......",
                    "...222222.......",
                    "...222222.......",
                    "....2222........",
                    "....2..2........",
                    "....2..2........",
                    "....5..5........",
                    "....5..5........",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................"
                ],
                walkR1: [
                    "................",
                    "................",
                    ".....444444.....",
                    "....4444444.....",
                    "....4444444.....",
                    ".....FFFF.......",
                    ".....FEFF.......",
                    ".....FFFF.......",
                    "......FF........",
                    "....222222......",
                    "....223222......",
                    "....222222......",
                    "....222222......",
                    ".....2222.......",
                    ".....2.2........",
                    "....2...2.......",
                    "....5...5.......",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................"
                ],
                walkR2: [
                    "................",
                    "................",
                    ".....444444.....",
                    "....4444444.....",
                    "....4444444.....",
                    ".....FFFF.......",
                    ".....FEFF.......",
                    ".....FFFF.......",
                    "......FF........",
                    "....222222......",
                    "....223222......",
                    "....222222......",
                    "....222222......",
                    ".....2222.......",
                    "......22........",
                    ".....2..2.......",
                    ".....5..5.......",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................"
                ],
                walkL1: [
                    "................",
                    "................",
                    ".....444444.....",
                    ".....4444444....",
                    ".....4444444....",
                    ".......FFFF.....",
                    ".......FFEF.....",
                    ".......FFFF.....",
                    "........FF......",
                    "......222222....",
                    "......222322....",
                    "......222222....",
                    "......222222....",
                    ".......2222.....",
                    "........2.2.....",
                    ".......2...2....",
                    ".......5...5....",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................"
                ],
                walkL2: [
                    "................",
                    "................",
                    ".....444444.....",
                    ".....4444444....",
                    ".....4444444....",
                    ".......FFFF.....",
                    ".......FFEF.....",
                    ".......FFFF.....",
                    "........FF......",
                    "......222222....",
                    "......222322....",
                    "......222222....",
                    "......222222....",
                    ".......2222.....",
                    "........22......",
                    ".......2..2.....",
                    ".......5..5.....",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................",
                    "................"
                ]
            },
            colors: {
                '.': null,           // transparent
                '4': '#4a3728',      // hat (brown)
                'F': '#e8c4a0',      // face (skin)
                'E': '#333333',      // eyes
                '2': '#2c2c5c',      // coat (dark blue)
                '3': '#feca57',      // coat button/detail
                '5': '#1a1a2e'       // shoes
            }
        };

        // Pre-render sprites to canvases
        const spriteCanvases = {};

        function renderSprite(frameData, colors, scale) {
            const w = frameData[0].length;
            const h = frameData.length;
            const spriteCanvas = document.createElement('canvas');
            spriteCanvas.width = w * scale;
            spriteCanvas.height = h * scale;
            const sctx = spriteCanvas.getContext('2d');

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const char = frameData[y][x];
                    const color = colors[char];
                    if (color) {
                        sctx.fillStyle = color;
                        sctx.fillRect(x * scale, y * scale, scale, scale);
                    }
                }
            }
            return spriteCanvas;
        }

        // Initialize sprite canvases
        Object.keys(SPRITE_DATA.frames).forEach(key => {
            spriteCanvases[key] = renderSprite(
                SPRITE_DATA.frames[key],
                SPRITE_DATA.colors,
                SPRITE_DATA.scale
            );
        });

        // Game state
        let gameState = 'menu'; // menu, playing, win, lose
        let lives = 3;
        let invincible = 0;

        // Player
        const player = {
            x: W / 2,
            y: H / 2,
            vx: 0,
            vy: 0,
            speed: 3.5,
            width: 28,
            height: 40,
            frame: 'idle',
            animTimer: 0,
            facing: 'right'
        };

        // Sources
        const sources = [
            { id: 'j', name: 'Jahwist', color: '#f1c40f', x: 0, y: 0, collected: false, bobOffset: 0 },
            { id: 'e', name: 'Elohist', color: '#2ecc71', x: 0, y: 0, collected: false, bobOffset: Math.PI/2 },
            { id: 'd', name: 'Deuteronomist', color: '#3498db', x: 0, y: 0, collected: false, bobOffset: Math.PI },
            { id: 'p', name: 'Priestly', color: '#9b59b6', x: 0, y: 0, collected: false, bobOffset: Math.PI*1.5 }
        ];

        // Enemies (Scrollworms - snake-like ancient creatures)
        let enemies = [];

        // Particles
        let particles = [];

        // Input
        const keys = {};

        // Initialize
        function init() {
            player.x = W / 2;
            player.y = H / 2;
            player.vx = 0;
            player.vy = 0;
            lives = 3;
            invincible = 0;
            updateLivesDisplay();

            // Reset sources
            sources.forEach(s => {
                s.collected = false;
                s.x = 60 + Math.random() * (W - 120);
                s.y = 60 + Math.random() * (H - 120);
                document.getElementById(`box-${s.id}`).classList.remove('collected');
            });

            // Create enemies
            enemies = [];
            for (let i = 0; i < 4; i++) {
                createEnemy();
            }

            particles = [];
            gameState = 'playing';
            document.getElementById('overlay').classList.add('hidden');
        }

        function createEnemy() {
            const segments = [];
            const startX = Math.random() < 0.5 ? -30 : W + 30;
            const startY = Math.random() * H;
            const angle = Math.atan2(H/2 - startY, W/2 - startX) + (Math.random() - 0.5);

            for (let i = 0; i < 8; i++) {
                segments.push({
                    x: startX - i * 12 * Math.cos(angle),
                    y: startY - i * 12 * Math.sin(angle)
                });
            }

            enemies.push({
                segments: segments,
                speed: 1.5 + Math.random(),
                angle: angle,
                turnTimer: 0,
                turnDir: Math.random() < 0.5 ? 1 : -1
            });
        }

        function updateLivesDisplay() {
            document.getElementById('lives').textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
        }

        // Input handlers
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        document.getElementById('startBtn').addEventListener('click', init);

        // Update
        function update() {
            if (gameState !== 'playing') return;

            // Player movement
            let dx = 0, dy = 0;
            if (keys['arrowleft'] || keys['a']) dx -= 1;
            if (keys['arrowright'] || keys['d']) dx += 1;
            if (keys['arrowup'] || keys['w']) dy -= 1;
            if (keys['arrowdown'] || keys['s']) dy += 1;

            // Normalize diagonal
            if (dx !== 0 && dy !== 0) {
                dx *= 0.707;
                dy *= 0.707;
            }

            player.vx = dx * player.speed;
            player.vy = dy * player.speed;
            player.x += player.vx;
            player.y += player.vy;

            // Bounds
            player.x = Math.max(20, Math.min(W - 20, player.x));
            player.y = Math.max(30, Math.min(H - 20, player.y));

            // Animation
            if (dx !== 0 || dy !== 0) {
                player.animTimer++;
                if (dx > 0) player.facing = 'right';
                if (dx < 0) player.facing = 'left';

                const walkFrame = Math.floor(player.animTimer / 8) % 2 + 1;
                player.frame = player.facing === 'right' ? `walkR${walkFrame}` : `walkL${walkFrame}`;
            } else {
                player.frame = 'idle';
                player.animTimer = 0;
            }

            // Invincibility
            if (invincible > 0) invincible--;

            // Update enemies
            enemies.forEach(enemy => {
                enemy.turnTimer++;
                if (enemy.turnTimer > 60 + Math.random() * 60) {
                    enemy.turnTimer = 0;
                    enemy.turnDir = Math.random() < 0.5 ? 1 : -1;
                }

                // Slightly home towards player
                const toPlayer = Math.atan2(player.y - enemy.segments[0].y, player.x - enemy.segments[0].x);
                let angleDiff = toPlayer - enemy.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                enemy.angle += Math.sign(angleDiff) * 0.02;
                enemy.angle += enemy.turnDir * 0.01;

                // Move head
                enemy.segments[0].x += Math.cos(enemy.angle) * enemy.speed;
                enemy.segments[0].y += Math.sin(enemy.angle) * enemy.speed;

                // Wrap around
                if (enemy.segments[0].x < -50) enemy.segments[0].x = W + 50;
                if (enemy.segments[0].x > W + 50) enemy.segments[0].x = -50;
                if (enemy.segments[0].y < -50) enemy.segments[0].y = H + 50;
                if (enemy.segments[0].y > H + 50) enemy.segments[0].y = -50;

                // Follow segments
                for (let i = 1; i < enemy.segments.length; i++) {
                    const prev = enemy.segments[i - 1];
                    const curr = enemy.segments[i];
                    const dist = Math.hypot(prev.x - curr.x, prev.y - curr.y);
                    if (dist > 12) {
                        const ang = Math.atan2(prev.y - curr.y, prev.x - curr.x);
                        curr.x += Math.cos(ang) * (dist - 12);
                        curr.y += Math.sin(ang) * (dist - 12);
                    }
                }

                // Collision with player
                if (invincible === 0) {
                    for (const seg of enemy.segments) {
                        const dist = Math.hypot(player.x - seg.x, player.y - seg.y);
                        if (dist < 20) {
                            lives--;
                            updateLivesDisplay();
                            invincible = 90;

                            // Knockback
                            const ang = Math.atan2(player.y - seg.y, player.x - seg.x);
                            player.x += Math.cos(ang) * 40;
                            player.y += Math.sin(ang) * 40;

                            // Particles
                            for (let i = 0; i < 10; i++) {
                                particles.push({
                                    x: player.x,
                                    y: player.y,
                                    vx: (Math.random() - 0.5) * 5,
                                    vy: (Math.random() - 0.5) * 5,
                                    life: 30,
                                    color: '#e74c3c'
                                });
                            }

                            if (lives <= 0) {
                                gameState = 'lose';
                                showOverlay('GAME OVER', 'The scrollworms got you!<br>You failed to reconstruct<br>the Torah...', 'lose');
                            }
                            break;
                        }
                    }
                }
            });

            // Source collection
            sources.forEach(source => {
                if (!source.collected) {
                    const dist = Math.hypot(player.x - source.x, player.y - source.y);
                    if (dist < 30) {
                        source.collected = true;
                        document.getElementById(`box-${source.id}`).classList.add('collected');

                        // Particles
                        for (let i = 0; i < 15; i++) {
                            particles.push({
                                x: source.x,
                                y: source.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 40,
                                color: source.color
                            });
                        }

                        // Check win
                        if (sources.every(s => s.collected)) {
                            gameState = 'win';
                            showOverlay('TORAH RESTORED!', 'You collected all four<br>Documentary Hypothesis sources!<br><br>J + E + D + P = Torah', 'win');
                        }
                    }
                }
            });

            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.95;
                p.vy *= 0.95;
                p.life--;
                return p.life > 0;
            });
        }

        function showOverlay(title, text, className) {
            const overlay = document.getElementById('overlay');
            const titleEl = document.getElementById('overlayTitle');
            const textEl = document.getElementById('overlayText');

            titleEl.textContent = title;
            titleEl.className = className || '';
            textEl.innerHTML = text;
            document.getElementById('startBtn').textContent = 'PLAY AGAIN';
            overlay.classList.remove('hidden');
        }

        // Draw
        function draw() {
            // Clear with dark background
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, W, H);

            // Draw subtle grid pattern (ancient stone floor)
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += TILE) {
                for (let y = 0; y < H; y += TILE) {
                    ctx.strokeRect(x, y, TILE, TILE);
                }
            }

            // Draw sources
            const time = Date.now() / 1000;
            sources.forEach(source => {
                if (!source.collected) {
                    const bob = Math.sin(time * 3 + source.bobOffset) * 4;
                    const x = source.x;
                    const y = source.y + bob;

                    // Glow
                    ctx.shadowColor = source.color;
                    ctx.shadowBlur = 20;

                    // Scroll shape
                    ctx.fillStyle = '#f5e6d3';
                    ctx.beginPath();
                    ctx.roundRect(x - 18, y - 12, 36, 24, 4);
                    ctx.fill();

                    // Scroll ends
                    ctx.fillStyle = source.color;
                    ctx.beginPath();
                    ctx.arc(x - 16, y, 8, 0, Math.PI * 2);
                    ctx.arc(x + 16, y, 8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.shadowBlur = 0;

                    // Letter
                    ctx.fillStyle = '#1a1a2e';
                    ctx.font = 'bold 16px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(source.id.toUpperCase(), x, y + 2);
                }
            });

            // Draw enemies (scrollworms)
            enemies.forEach(enemy => {
                // Draw segments back to front
                for (let i = enemy.segments.length - 1; i >= 0; i--) {
                    const seg = enemy.segments[i];
                    const size = i === 0 ? 14 : 10 - i * 0.5;

                    // Body
                    ctx.fillStyle = i === 0 ? '#8b0000' : '#5c1010';
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Highlight
                    ctx.fillStyle = '#a02020';
                    ctx.beginPath();
                    ctx.arc(seg.x - 2, seg.y - 2, size * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes on head
                    if (i === 0) {
                        const eyeAng = enemy.angle;
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(seg.x + Math.cos(eyeAng - 0.4) * 6, seg.y + Math.sin(eyeAng - 0.4) * 6, 3, 0, Math.PI * 2);
                        ctx.arc(seg.x + Math.cos(eyeAng + 0.4) * 6, seg.y + Math.sin(eyeAng + 0.4) * 6, 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(seg.x + Math.cos(eyeAng - 0.4) * 7, seg.y + Math.sin(eyeAng - 0.4) * 7, 1.5, 0, Math.PI * 2);
                        ctx.arc(seg.x + Math.cos(eyeAng + 0.4) * 7, seg.y + Math.sin(eyeAng + 0.4) * 7, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // Draw player
            const sprite = spriteCanvases[player.frame] || spriteCanvases['idle'];
            const flashOn = invincible > 0 && Math.floor(invincible / 4) % 2 === 0;

            if (!flashOn) {
                ctx.drawImage(
                    sprite,
                    player.x - sprite.width / 2,
                    player.y - sprite.height / 2 - 5
                );
            }

            // Draw particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
            });
            ctx.globalAlpha = 1;
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
