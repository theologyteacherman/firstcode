// --- AUDIO ENGINE ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(type) {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    switch(type) {
        case 'jump':
            o.type = 'square'; o.frequency.setValueAtTime(200, t);
            o.frequency.linearRampToValueAtTime(600, t+0.15);
            g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t+0.2);
            o.start(t); o.stop(t+0.2); break;
        case 'land':
            o.type = 'triangle'; o.frequency.setValueAtTime(120, t);
            g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t+0.1);
            o.start(t); o.stop(t+0.1); break;
        case 'collect':
            o.type = 'sine'; o.frequency.setValueAtTime(523, t);
            o.frequency.setValueAtTime(659, t+0.1); o.frequency.setValueAtTime(784, t+0.2);
            g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t+0.35);
            o.start(t); o.stop(t+0.35); break;
        case 'hurt':
            o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t);
            o.frequency.linearRampToValueAtTime(100, t+0.3);
            g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t+0.4);
            o.start(t); o.stop(t+0.4); break;
        case 'win':
            o.type = 'sine';
            [523,587,659,784,1047].forEach((f,i) => {
                o.frequency.setValueAtTime(f, t+i*0.12);
            });
            g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t+0.7);
            o.start(t); o.stop(t+0.7); break;
        case 'die':
            o.type = 'square'; o.frequency.setValueAtTime(400, t);
            o.frequency.linearRampToValueAtTime(80, t+0.6);
            g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t+0.7);
            o.start(t); o.stop(t+0.7); break;
        case 'levelComplete':
            o.type = 'sine';
            [523,659,784,1047,784,1047].forEach((f,i) => {
                o.frequency.setValueAtTime(f, t+i*0.15);
            });
            g.gain.setValueAtTime(0.25, t); g.gain.linearRampToValueAtTime(0, t+1.0);
            o.start(t); o.stop(t+1.0); break;
    }
}

// --- PARTICLE SYSTEM ---
const particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color,
            size: 2 + Math.random() * 4
        });
    }
}
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.15; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    particles.forEach(p => {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
}

// --- COLLISION HELPERS ---
function rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function isOnLadder(px, py, pw) {
    const cx = px + pw/2;
    for (const L of levelData.ladders) {
        // Extend detection 20px above ladder top so player can climb onto the platform
        if (cx > L.x && cx < L.x + 28 && py + PLAYER_H >= L.y - 20 && py < L.y + L.h) return true;
    }
    return false;
}

function isLadderBelow(px, py, pw) {
    const cx = px + pw/2;
    for (const L of levelData.ladders) {
        if (cx > L.x && cx < L.x + 28 && py + PLAYER_H >= L.y - 5 && py + PLAYER_H <= L.y + 10) return true;
    }
    return false;
}

// --- UPDATE ---
function update() {
    scrollBob += 0.05;

    if (gameState === 'title') {
        if (keys['Space'] || keys['Enter']) {
            ensureAudio();
            gameState = 'playing';
            currentLevel = 0;
            lives = 3;
            score = 0;
            sourcesCollected = [false, false, false, false];
            initLevel(0);
        }
        return;
    }

    if (gameState === 'levelComplete') {
        levelCompleteTimer--;
        updateParticles();
        if (levelCompleteTimer <= 0) {
            currentLevel++;
            if (currentLevel >= 4) {
                gameState = 'victory';
                victoryTimer = 300;
                playSound('win');
            } else {
                gameState = 'playing';
                initLevel(currentLevel);
            }
        }
        return;
    }

    if (gameState === 'gameOver') {
        gameOverTimer--;
        if (gameOverTimer <= 0 && (keys['Space'] || keys['Enter'])) {
            gameState = 'title';
        }
        return;
    }

    if (gameState === 'victory') {
        updateParticles();
        victoryTimer--;
        if (victoryTimer % 15 === 0 && victoryTimer > 100) {
            spawnParticles(Math.random()*800, Math.random()*400, ['#FFD700','#87CEEB','#90EE90','#DDA0DD'][Math.floor(Math.random()*4)], 10);
        }
        if (victoryTimer <= 0 && (keys['Space'] || keys['Enter'])) {
            gameState = 'title';
        }
        return;
    }

    // --- PLAYING STATE ---
    const P = player;

    P.vx = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) { P.vx = -MOVE_SPEED; P.facing = 'west'; }
    if (keys['ArrowRight'] || keys['KeyD']) { P.vx = MOVE_SPEED; P.facing = 'east'; }

    const onLadder = isOnLadder(P.x, P.y, P.w);
    const ladderBelow = isLadderBelow(P.x, P.y, P.w);

    if (onLadder && (keys['ArrowUp'] || keys['KeyW'])) {
        P.climbing = true;
    }
    if (ladderBelow && (keys['ArrowDown'] || keys['KeyS'])) {
        P.climbing = true;
        P.y += 5;
    }

    if (P.climbing) {
        P.vy = 0;
        if (keys['ArrowUp'] || keys['KeyW']) P.vy = -CLIMB_SPEED;
        if (keys['ArrowDown'] || keys['KeyS']) P.vy = CLIMB_SPEED;
        if (!isOnLadder(P.x, P.y, P.w)) P.climbing = false;
        if ((keys['Space']) && P.onGround && !keys['ArrowDown'] && !keys['KeyS']) {
            P.climbing = false;
        }
    }

    if (!P.climbing) {
        P.vy += GRAVITY;
        if (P.vy > 12) P.vy = 12;
    }

    if ((keys['Space']) && P.onGround && !P.climbing) {
        P.vy = JUMP_FORCE;
        P.onGround = false;
        playSound('jump');
    }

    P.x += P.vx;
    for (const plat of levelData.platforms) {
        if (rectOverlap({x: P.x, y: P.y, w: P.w, h: P.h}, plat)) {
            if (P.vx > 0) P.x = plat.x - P.w;
            if (P.vx < 0) P.x = plat.x + plat.w;
        }
    }

    if (P.x < 0) P.x = 0;
    if (P.x + P.w > 800) P.x = 800 - P.w;

    P.wasOnGround = P.onGround;
    P.y += P.vy;
    P.onGround = false;

    for (const plat of levelData.platforms) {
        if (rectOverlap({x: P.x, y: P.y, w: P.w, h: P.h}, plat)) {
            if (P.vy > 0) {
                P.y = plat.y - P.h;
                if (!P.wasOnGround && P.vy > 3) playSound('land');
                P.vy = 0;
                P.onGround = true;
            } else if (P.vy < 0) {
                P.y = plat.y + plat.h;
                P.vy = 0;
            }
        }
    }

    if (P.y > 620) { loseLife(); return; }

    for (const e of levelEnemies) {
        e.x += e.speed;
        if (e.x <= e.minX || e.x + e.w >= e.maxX) e.speed *= -1;
    }

    if (invincibleTimer > 0) {
        invincibleTimer--;
    } else {
        for (const e of levelEnemies) {
            if (rectOverlap({x: P.x+4, y: P.y+4, w: P.w-8, h: P.h-8}, e)) {
                loseLife(); return;
            }
        }
    }

    const sc = levelData.scrollPos;
    const scrollRect = { x: sc.x, y: sc.y + Math.sin(scrollBob)*6, w: 40, h: 50 };
    if (rectOverlap({x: P.x, y: P.y, w: P.w, h: P.h}, scrollRect)) {
        sourcesCollected[currentLevel] = true;
        score += 2500;
        playSound('levelComplete');
        spawnParticles(sc.x + 20, sc.y + 25, SOURCES[currentLevel].color, 30);
        gameState = 'levelComplete';
        levelCompleteTimer = 150;
    }

    updateParticles();
}

function loseLife() {
    lives--;
    playSound(lives <= 0 ? 'die' : 'hurt');
    if (lives <= 0) {
        gameState = 'gameOver';
        gameOverTimer = 120;
    } else {
        spawnParticles(player.x + PLAYER_W/2, player.y + PLAYER_H/2, '#FF4444', 20);
        player.x = levelData.playerStart.x;
        player.y = levelData.playerStart.y;
        player.vx = 0; player.vy = 0;
        player.climbing = false;
        invincibleTimer = 90;
    }
}

// --- DRAW ---
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, 800, 600);

    bgStars.forEach(s => {
        s.b += 0.02;
        ctx.globalAlpha = 0.3 + Math.sin(s.b) * 0.3;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s.x, s.y, s.s, s.s);
    });
    ctx.globalAlpha = 1;

    if (gameState === 'title') { drawTitle(); return; }
    if (gameState === 'gameOver') { drawGameOver(); return; }
    if (gameState === 'victory') { drawVictory(); return; }

    drawLevel();
    drawEnemies();
    drawScroll();
    drawPlayer();
    drawParticles();
    drawHUD();

    if (gameState === 'levelComplete') drawLevelComplete();
}

function drawTitle() {
    const t = Date.now() / 1000;

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('BIBLICAL DETECTIVE', 400, 150);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '20px monospace';
    ctx.fillText('The Documentary Hypothesis', 400, 190);

    if (spriteImages.south && spriteImages.south.complete) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(spriteImages.south, 364, 230, 72, 72);
    }

    SOURCES.forEach((s, i) => {
        const bx = 120 + i * 160;
        ctx.fillStyle = s.color;
        ctx.font = 'bold 18px monospace';
        ctx.fillText(s.key + ' Source', bx, 350);
        ctx.fillStyle = '#888';
        ctx.font = '11px monospace';
        const words = s.desc.split(', ');
        words.forEach((w, j) => {
            ctx.fillText(w, bx, 370 + j * 15);
        });
    });

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '18px monospace';
    if (Math.sin(t * 3) > 0) ctx.fillText('PRESS SPACE TO START', 400, 470);

    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    ctx.fillText('Arrow Keys / WASD to move | SPACE to jump', 400, 520);
    ctx.fillText('Climb ladders to reach the Source Scrolls!', 400, 545);
    ctx.textAlign = 'left';
}

function drawLevel() {
    const src = SOURCES[currentLevel];

    for (const p of levelData.platforms) {
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, '#8B6914');
        grad.addColorStop(1, '#5C4A0E');
        ctx.fillStyle = grad;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = '#A67C00';
        ctx.fillRect(p.x, p.y, p.w, 3);

        ctx.strokeStyle = '#4A3500';
        ctx.lineWidth = 1;
        for (let bx = p.x; bx < p.x + p.w; bx += 32) {
            ctx.beginPath();
            ctx.moveTo(bx, p.y); ctx.lineTo(bx, p.y + p.h);
            ctx.stroke();
        }
    }

    for (const L of levelData.ladders) {
        const lw = 28;
        ctx.fillStyle = '#6699CC';
        ctx.fillRect(L.x, L.y, 4, L.h);
        ctx.fillRect(L.x + lw - 4, L.y, 4, L.h);

        ctx.fillStyle = '#88AADD';
        for (let ry = L.y + 8; ry < L.y + L.h; ry += 18) {
            ctx.fillRect(L.x + 2, ry, lw - 4, 3);
        }
    }

    ctx.strokeStyle = src.color + '33';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, 796, 596);
}

function drawEnemies() {
    const t = Date.now() / 200;
    for (const e of levelEnemies) {
        const segments = 5;
        const segW = e.w / segments;
        for (let i = 0; i < segments; i++) {
            const sy = Math.sin(t + i * 0.8) * 3;
            const segX = e.x + i * segW;
            const segY = e.y + sy;

            ctx.fillStyle = i === 0 ? '#FF3333' : (i % 2 === 0 ? '#CC2222' : '#AA1111');
            ctx.beginPath();
            ctx.arc(segX + segW/2, segY + 8, segW/2 + 2, 0, Math.PI * 2);
            ctx.fill();
        }
        const headX = e.speed > 0 ? e.x + e.w - segW : e.x;
        const headSy = Math.sin(t) * 3;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(headX + segW/2 - 3, e.y + headSy + 5, 3, 0, Math.PI * 2);
        ctx.arc(headX + segW/2 + 3, e.y + headSy + 5, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(headX + segW/2 - 3 + (e.speed > 0 ? 1 : -1), e.y + headSy + 5, 1.5, 0, Math.PI * 2);
        ctx.arc(headX + segW/2 + 3 + (e.speed > 0 ? 1 : -1), e.y + headSy + 5, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawScroll() {
    const sc = levelData.scrollPos;
    const src = SOURCES[currentLevel];
    const bob = Math.sin(scrollBob) * 6;
    const sx = sc.x;
    const sy = sc.y + bob;

    ctx.globalAlpha = 0.3 + Math.sin(scrollBob * 2) * 0.15;
    ctx.fillStyle = src.color;
    ctx.beginPath();
    ctx.arc(sx + 20, sy + 25, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#F5DEB3';
    ctx.fillRect(sx + 5, sy + 8, 30, 34);

    ctx.fillStyle = '#8B6914';
    ctx.beginPath(); ctx.arc(sx + 8, sy + 8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 32, sy + 8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 8, sy + 42, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 32, sy + 42, 6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = src.color;
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(src.key, sx + 20, sy + 35);
    ctx.textAlign = 'left';

    if (player) {
        const dx = sx + 20 - (player.x + PLAYER_W/2);
        const dy = sy + 25 - (player.y + PLAYER_H/2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 120) {
            const angle = Math.atan2(dy, dx);
            const arrowX = player.x + PLAYER_W/2 + Math.cos(angle) * 50;
            const arrowY = player.y + PLAYER_H/2 + Math.sin(angle) * 50;
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = src.color;
            ctx.save();
            ctx.translate(arrowX, arrowY);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(10, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6);
            ctx.closePath(); ctx.fill();
            ctx.restore();
            ctx.globalAlpha = 1;
        }
    }
}

function drawPlayer() {
    const P = player;
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) return;

    const img = spriteImages[P.facing] || spriteImages.south;
    if (img && img.complete) {
        ctx.imageSmoothingEnabled = false;
        const dx = Math.round(P.x - 6);
        const dy = Math.round(P.y - 3);
        ctx.drawImage(img, dx, dy, PLAYER_W + 12, PLAYER_H + 6);
    } else {
        ctx.fillStyle = '#FF8800';
        ctx.fillRect(P.x, P.y, P.w, P.h);
    }
}

function drawHUD() {
    const src = SOURCES[currentLevel];

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 800, 36);

    ctx.fillStyle = src.color;
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Level ' + (currentLevel + 1) + ': ' + src.name, 10, 24);

    ctx.fillStyle = '#FF6666';
    ctx.font = '16px monospace';
    ctx.textAlign = 'right';
    let livesStr = '';
    for (let i = 0; i < lives; i++) livesStr += '\u2764 ';
    ctx.fillText(livesStr, 790, 24);

    ctx.fillStyle = '#FFD700';
    ctx.textAlign = 'center';
    ctx.fillText('Score: ' + score, 400, 24);

    ctx.textAlign = 'left';
    for (let i = 0; i < 4; i++) {
        const bx = 560 + i * 28;
        ctx.fillStyle = sourcesCollected[i] ? SOURCES[i].color : '#333';
        ctx.font = 'bold 14px monospace';
        ctx.fillText(SOURCES[i].key, bx, 24);
    }
    ctx.textAlign = 'left';
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, 800, 600);

    const src = SOURCES[currentLevel];
    ctx.textAlign = 'center';
    ctx.fillStyle = src.color;
    ctx.font = 'bold 36px monospace';
    ctx.fillText(src.key + ' SOURCE FOUND!', 400, 240);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '18px monospace';
    ctx.fillText(src.desc, 400, 290);

    ctx.fillStyle = '#888';
    ctx.font = '16px monospace';
    if (currentLevel < 3) {
        ctx.fillText('Next: ' + SOURCES[currentLevel + 1].name, 400, 340);
    } else {
        ctx.fillText('All sources collected!', 400, 340);
    }
    ctx.textAlign = 'left';
}

function drawGameOver() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, 800, 600);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FF4444';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GAME OVER', 400, 250);

    ctx.fillStyle = '#FFD700';
    ctx.font = '24px monospace';
    ctx.fillText('Score: ' + score, 400, 310);

    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    ctx.fillText('Sources found: ' + sourcesCollected.filter(Boolean).length + ' / 4', 400, 350);

    if (gameOverTimer <= 0) {
        if (Math.sin(Date.now() / 300) > 0) {
            ctx.fillStyle = '#FFF';
            ctx.font = '18px monospace';
            ctx.fillText('PRESS SPACE TO CONTINUE', 400, 420);
        }
    }
    ctx.textAlign = 'left';
}

function drawVictory() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, 800, 600);
    drawParticles();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 40px monospace';
    ctx.fillText('TORAH RECONSTRUCTED!', 400, 140);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '18px monospace';
    ctx.fillText('The Biblical Detective has uncovered all four sources', 400, 190);
    ctx.fillText('of the Documentary Hypothesis!', 400, 215);

    SOURCES.forEach((s, i) => {
        const bx = 100 + i * 170;
        ctx.fillStyle = s.color;
        ctx.font = 'bold 24px monospace';
        ctx.fillText(s.key, bx, 290);
        ctx.font = '12px monospace';
        ctx.fillText(s.name, bx, 312);
    });

    if (spriteImages.south && spriteImages.south.complete) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(spriteImages.south, 364, 340, 72, 72);
    }

    ctx.fillStyle = '#FFD700';
    ctx.font = '24px monospace';
    ctx.fillText('Final Score: ' + score, 400, 460);

    if (victoryTimer <= 0) {
        if (Math.sin(Date.now() / 300) > 0) {
            ctx.fillStyle = '#FFF';
            ctx.font = '18px monospace';
            ctx.fillText('PRESS SPACE TO PLAY AGAIN', 400, 520);
        }
    }
    ctx.textAlign = 'left';
}

// --- GAME LOOP ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
